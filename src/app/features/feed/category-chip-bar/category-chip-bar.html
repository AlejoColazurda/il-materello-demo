<div class="chipbar">
  @for (category of categories(); track category.id) {
    <button
      type="button"
      class="chip"
      [class.active]="category.id === activeCategoryId()"
      [style.--chip-color]="category.color || '#f5c518'"
      (click)="selectCategory(category.id)"
    >
      @if (category.icon) {
        <i class="ti ti-{{ category.icon }} chip-icon"></i>
      }
      <span>{{ category.label }}</span>
    </button>
  }
</div>
