<div class="rail" [class.compact]="compact()">
  <!-- Botón de Like estilo Instagram -->
  <button
    type="button"
    class="rail-btn like-btn"
    [class.liked]="liked()"
    (click)="likeToggled.emit()"
    title="Me gusta"
  >
    <div class="icon-wrap">
      @if (liked()) {
        <!-- Corazón relleno Instagram con animación pop -->
        <svg class="rail-icon heart-filled" viewBox="0 0 24 24" width="30" height="30">
          <path
            fill="#ff2d55"
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
      } @else {
        <!-- Corazón outline blanco Instagram -->
        <svg class="rail-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      }
    </div>
    <span class="rail-count">{{ dish().likes }}</span>
  </button>

  <!-- Botón de Comentarios estilo Instagram -->
  <button
    type="button"
    class="rail-btn comment-btn"
    (click)="commentsToggled.emit()"
    title="Comentarios"
  >
    <div class="icon-wrap">
      <svg class="rail-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
    </div>
    <span class="rail-count">{{ commentCount() }}</span>
  </button>

  @if (!compact()) {
    <!-- Botón de Compartir estilo Avión de Papel (Instagram Direct) -->
    <button
      type="button"
      class="rail-btn share-btn"
      (click)="shareRequested.emit()"
      title="Compartir plato"
    >
      <div class="icon-wrap">
        <svg class="rail-icon plane-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </div>
      <span class="rail-count">{{ dish().shares ?? 24 }}</span>
    </button>

    <!-- Botón de Pedir / Carrito interactivo -->
    @if (dish().inStock) {
      <button
        type="button"
        class="rail-btn order-btn"
        (click)="orderRequested.emit()"
        title="Agregar a mi pedido"
      >
        <div class="icon-wrap order-icon-wrap">
          <svg class="rail-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span class="plus-badge">+</span>
        </div>
        <span class="rail-count rail-label-pedir">Pedir</span>
      </button>
    } @else {
      <button type="button" class="rail-btn disabled-btn" disabled title="Plato agotado">
        <div class="icon-wrap">
          <svg class="rail-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
          </svg>
        </div>
        <span class="rail-count rail-label-agotado">Agotado</span>
      </button>
    }

    <!-- Disco de Audio / Ambiente giratorio estilo Instagram Reels -->
    <div class="music-disc-wrap" title="Audio de la casa · Il Materello">
      <div class="disc-cover">
        <span><i class="ti ti-tools-kitchen-2"></i></span>
      </div>
    </div>
  }
</div>
