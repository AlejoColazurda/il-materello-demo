<div class="frame">
  <div class="statusbar">
    <span>9:41</span>
    <button
      type="button"
      class="statusbar-profile-btn"
      (click)="openProfileRequested.emit()"
      title="Mi Perfil"
    >
      @if (userProfile().avatar) {
        <img class="statusbar-avatar" [src]="userProfile().avatar" alt="Avatar" />
      } @else {
        <div class="statusbar-avatar-fallback"><i class="ti ti-user"></i></div>
      }
      <span class="statusbar-nickname">&#64;{{ userProfile().nickname }}</span>
    </button>
  </div>

  <app-category-chip-bar
    [categories]="categories()"
    [activeCategoryId]="activeCategoryId()"
    (categorySelected)="onCategorySelected($event)"
  />

  <div class="feed">
    @for (dish of dishes(); track dish.id; let i = $index) {
      <app-dish-card [dish]="dish" [dotIndex]="i" />
    }
  </div>

  <app-order-drawer />
</div>
