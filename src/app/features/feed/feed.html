<div class="frame" [class.mode-lista]="viewMode() === 'lista'">
  <header class="menu-header">
    <div class="mode-toggle" role="tablist" aria-label="Cómo ver la carta">
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.active]="viewMode() === 'reels'"
        [attr.aria-selected]="viewMode() === 'reels'"
        (click)="setViewMode('reels')"
      >
        <i class="ti ti-player-play"></i>
        <span>Reels</span>
      </button>
      <button
        type="button"
        role="tab"
        class="mode-btn"
        [class.active]="viewMode() === 'lista'"
        [attr.aria-selected]="viewMode() === 'lista'"
        (click)="setViewMode('lista')"
      >
        <i class="ti ti-list"></i>
        <span>Lista</span>
      </button>
    </div>

    <button
      type="button"
      class="profile-btn"
      (click)="openProfileRequested.emit()"
      title="Mi perfil"
      aria-label="Mi perfil"
    >
      @if (userProfile().avatar) {
        <img class="profile-avatar" [src]="userProfile().avatar" alt="" />
      } @else {
        <span class="profile-avatar-fallback"><i class="ti ti-user"></i></span>
      }
    </button>
  </header>

  <app-category-chip-bar
    [categories]="categories()"
    [activeCategoryId]="activeCategoryId()"
    (categorySelected)="onCategorySelected($event)"
  />

  <!-- Vista Reels: un plato por pantalla, se desliza hacia arriba -->
  <div class="feed" #feed [hidden]="viewMode() !== 'reels'" (scroll)="onFeedScroll()">
    @for (dish of dishes(); track dish.id) {
      <app-dish-card [dish]="dish" />
    }
  </div>

  @if (viewMode() === 'reels' && showSwipeHint()) {
    <button type="button" class="swipe-hint" (click)="dismissSwipeHint()">
      <i class="ti ti-chevron-up"></i>
      <span>Deslizá para ver más platos</span>
    </button>
  }

  <!-- Vista Lista: carta clásica por secciones -->
  @if (viewMode() === 'lista') {
    <app-menu-list
      [categories]="categories()"
      [dishes]="dishes()"
      (dishOpened)="openDishInReels($event)"
    />
  }

  @if (!commentsOpen()) {
    <app-cart-bar />
  }

  <app-order-drawer />
</div>
