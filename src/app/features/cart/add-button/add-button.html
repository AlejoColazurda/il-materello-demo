@if (!dish().inStock) {
  <span class="sold-out" [class.compact]="variant() === 'compact'">
    <i class="ti ti-ban"></i>
    @if (variant() === 'wide') {
      <span>Agotado por hoy</span>
    } @else {
      <span>Agotado</span>
    }
  </span>
} @else if (quantity() === 0) {
  <button
    type="button"
    class="add-btn"
    [class.compact]="variant() === 'compact'"
    (click)="add($event)"
    [attr.aria-label]="'Agregar ' + dish().name + ' al pedido'"
  >
    <i class="ti ti-plus"></i>
    @if (variant() === 'wide') {
      <span>Agregar al pedido</span>
    }
  </button>
} @else {
  <div class="stepper" [class.compact]="variant() === 'compact'">
    <button
      type="button"
      class="step"
      (click)="remove($event)"
      [attr.aria-label]="'Quitar uno de ' + dish().name"
    >
      @if (quantity() === 1) {
        <i class="ti ti-trash"></i>
      } @else {
        <i class="ti ti-minus"></i>
      }
    </button>
    <span class="qty" aria-live="polite">
      {{ quantity() }}
      @if (variant() === 'wide') {
        <small>en tu pedido</small>
      }
    </span>
    <button
      type="button"
      class="step"
      (click)="add($event)"
      [attr.aria-label]="'Sumar uno de ' + dish().name"
    >
      <i class="ti ti-plus"></i>
    </button>
  </div>
}
