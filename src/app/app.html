<div class="app-layout">
  <!-- Barra Superior Principal -->
  <header class="demo-topbar">
    <div class="demo-brand" (click)="setView('cliente')">
      <span class="logo"><i class="ti ti-tools-kitchen-2"></i></span>
      <span class="brand-name">Il Matterello · Palermo</span>
    </div>

    <!-- Navegación central / switch de vistas -->
    <div class="view-switcher">
      <button
        type="button"
        class="switch-btn"
        [class.active]="currentView() === 'cliente'"
        (click)="setView('cliente')"
      >
        <span class="icon"><i class="ti ti-device-mobile"></i></span>
        <span>Carta Reels</span>
      </button>

      <button
        type="button"
        class="switch-btn"
        [class.active]="currentView() === 'mozos'"
        (click)="setView('mozos')"
      >
        <span class="icon"><i class="ti ti-bell-ringing"></i></span>
        <span>Panel Mozos</span>
        @if (pendingOrdersCount() > 0) {
          <span class="counter-badge">{{ pendingOrdersCount() }}</span>
        }
      </button>

      <button
        type="button"
        class="switch-btn"
        [class.active]="currentView() === 'admin'"
        (click)="setView('admin')"
      >
        <span class="icon"><i class="ti ti-settings"></i></span>
        <span>Backoffice & Admin</span>
      </button>

      <button
        type="button"
        class="switch-btn btn-create-reel"
        (click)="openReelComposer()"
        title="Subir nuevo plato como Reel de Instagram"
      >
        <span class="icon"><i class="ti ti-video-plus"></i></span>
        <span>+ Subir Reel</span>
      </button>
    </div>

    <!-- Acciones de Usuario y Personal a la derecha -->
    <div class="topbar-user-actions">
      <!-- Botón de Mi Perfil (Instagram style): disponible para comensales y empleados -->
      <button
        type="button"
        class="btn-profile-topbar"
        (click)="openProfileModal()"
        title="Mi Perfil · Cambiar foto y apodo"
      >
        <div class="profile-thumb-ring">
          @if (staffUser()?.avatar || userProfile().avatar) {
            <img
              class="thumb-img"
              [src]="staffUser()?.avatar || userProfile().avatar"
              alt="Avatar"
            />
          } @else {
            <div class="thumb-fallback"><i class="ti ti-user"></i></div>
          }
        </div>
        <div class="profile-meta-text">
          <span class="profile-handle">&#64;{{ staffUser()?.nickname || userProfile().nickname }}</span>
          <span class="profile-hint">Mi Perfil</span>
        </div>
      </button>

      <!-- Estado de Personal: Sesión activa o Botón de Acceso -->
      @if (staffUser(); as staff) {
        <div class="staff-logged-badge">
          <span class="role-pill" [class]="'role-' + staff.roleId">
            {{ staff.roleId | uppercase }}
          </span>
          <button
            type="button"
            class="btn-logout"
            (click)="logoutStaff()"
            title="Cerrar sesión de personal"
          >
            <i class="ti ti-logout"></i>
            <span class="btn-text-logout">Salir</span>
          </button>
        </div>
      } @else {
        <button
          type="button"
          class="btn-staff-access"
          (click)="openStaffAuth()"
          title="Acceso para mozos, cocina y administración"
        >
          <i class="ti ti-lock"></i>
          <span>Personal</span>
        </button>
      }
    </div>
  </header>

  <!-- Contenido según la vista seleccionada -->
  <main class="demo-main">
    @switch (currentView()) {
      @case ('cliente') {
        <app-feed (openProfileRequested)="openProfileModal()" />
      }
      @case ('mozos') {
        <app-waiter-panel />
      }
      @case ('admin') {
        <app-admin-panel (openComposerRequested)="openReelComposer()" />
      }
    }
  </main>

  <!-- Modales del sistema -->
  <!-- 1. Modal Mi Perfil (Cargar foto desde celular/PC + Apodo) -->
  <app-profile-modal
    [isOpen]="isProfileModalOpen()"
    (closed)="closeProfileModal()"
  />

  <!-- 2. Modal de Autenticación de Personal (Login con ojo, registro, recuperar y demos) -->
  <app-staff-auth-modal
    [isOpen]="isStaffAuthOpen()"
    (closed)="closeStaffAuth()"
    (loginSuccess)="onStaffLoginSuccess()"
  />

  <!-- 3. Modal estilo Instagram para subir nuevos Reels -->
  <app-reel-composer
    [isOpen]="isReelComposerOpen()"
    (closed)="closeReelComposer()"
    (dishPublished)="onReelCreated($event)"
  />
</div>
