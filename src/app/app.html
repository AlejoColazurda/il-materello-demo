<div class="app-layout">
  <!-- Barra superior: cambia de aspecto según si mira un cliente o el personal -->
  @if (staffUser(); as staff) {
    <header [class]="'topbar topbar-staff role-' + staff.roleId">
      <div class="brand" (click)="setView(defaultStaffView())">
        <span class="logo"><i class="ti ti-tools-kitchen-2"></i></span>
        <span class="brand-text">
          <span class="brand-name">Il Matterello</span>
          <span class="brand-mode"><i class="ti ti-shield-lock"></i> Modo personal</span>
        </span>
      </div>

      <nav class="staff-nav" aria-label="Secciones del personal">
        @if (canSeeOrders()) {
          <button
            type="button"
            class="nav-btn"
            [class.active]="currentView() === 'mozos'"
            (click)="setView('mozos')"
          >
            <i class="ti ti-bell-ringing"></i>
            <span>Comandas</span>
            @if (pendingOrdersCount() > 0) {
              <span class="counter-badge">{{ pendingOrdersCount() }}</span>
            }
          </button>
        }
        @if (canSeeAdmin()) {
          <button
            type="button"
            class="nav-btn"
            [class.active]="currentView() === 'admin'"
            (click)="setView('admin')"
          >
            <i class="ti ti-settings"></i>
            <span>Administración</span>
          </button>
        }
        @if (permissions().canCreateDishes) {
          <button type="button" class="nav-btn nav-btn-reel" (click)="openReelComposer()">
            <i class="ti ti-video-plus"></i>
            <span>Subir reel</span>
          </button>
        }
        <button
          type="button"
          class="nav-btn nav-btn-preview"
          [class.active]="currentView() === 'cliente'"
          (click)="setView('cliente')"
          [title]="permissions().canViewOrders ? 'Cargar una comanda desde la carta' : 'Ver la carta tal como la ve el comensal'"
        >
          <i class="ti ti-eye"></i>
          <span>{{ permissions().canViewOrders ? 'Carta · tomar comanda' : 'Ver como cliente' }}</span>
        </button>
      </nav>

      <div class="staff-user">
        <button type="button" class="staff-user-btn" (click)="openProfileModal()" title="Mi perfil">
          @if (staff.avatar) {
            <img class="staff-avatar" [src]="staff.avatar" alt="" />
          } @else {
            <span class="staff-avatar staff-avatar-fallback"><i class="ti ti-user"></i></span>
          }
          <span class="staff-meta">
            <span class="staff-name">{{ staff.name }}</span>
            <span class="staff-role">{{ roleLabel() }}</span>
          </span>
        </button>
        <button type="button" class="btn-logout" (click)="logoutStaff()" title="Cerrar sesión">
          <i class="ti ti-logout"></i>
          <span class="btn-logout-text">Salir</span>
        </button>
      </div>
    </header>
  } @else {
    <header class="topbar topbar-client">
      <div class="brand">
        <span class="logo"><i class="ti ti-tools-kitchen-2"></i></span>
        <span class="brand-text">
          <span class="brand-name">Il Matterello</span>
          <span class="brand-mode"><i class="ti ti-user"></i> Vista cliente</span>
        </span>
      </div>
    </header>
  }

  <!-- Contenido según la vista seleccionada -->
  <main class="demo-main">
    @switch (currentView()) {
      @case ('cliente') {
        <app-feed (openProfileRequested)="openProfileModal()" />
      }
      @case ('mozos') {
        <app-waiter-panel />
      }
      @case ('admin') {
        <app-admin-panel (openComposerRequested)="openReelComposer()" />
      }
    }
  </main>

  <!-- Modales del sistema -->
  <!-- 1. Modal Mi Perfil (Cargar foto desde celular/PC + Apodo) -->
  <app-profile-modal
    [isOpen]="isProfileModalOpen()"
    (closed)="closeProfileModal()"
  />

  <!-- 3. Modal estilo Instagram para subir nuevos Reels -->
  <app-reel-composer
    [isOpen]="isReelComposerOpen()"
    (closed)="closeReelComposer()"
    (dishPublished)="onReelCreated($event)"
  />
</div>
